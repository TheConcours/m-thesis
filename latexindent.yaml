onlyOneBackUp: 1

logFilePreferences:
  showEveryYamlRead: 0
  showAmalgamatedSettings: 1
  showDecorationStartCodeBlockTrace: "+++++"
  showDecorationFinishCodeBlockTrace: "-----"
  Dumper:
    Deparse: 1
    Indent: 1
    Pair: " => "
    Quotekeys: 0
    Sortkeys: 1
    Terse: 1
    Useqq: 1
  endLogFileWith: "--------------"
  showGitHubInfoFooter: 1
maxNumberOfBackUps: 0
maximumIndentation: -1
noIndentBlock:
  cmhtest: 1
  noindent: 1
removeTrailingWhitespace:
  afterProcessing: 1
  beforeProcessing: 0
defaultIndent: "  "
dos2unixlinebreaks: 0
indentPreamble: 0
indentRules:
  anotherenvironment: "        "
  chapter: " "
  item: "      "
  myenvironment: "    "
  myitem: "        "
  section: " "
indentAfterHeadings:
  chapter:
    indentAfterThisHeading: 0
    level: 2
  paragraph:
    indentAfterThisHeading: 0
    level: 6
  part:
    indentAfterThisHeading: 0
    level: 1
  section:
    indentAfterThisHeading: 0
    level: 3
  subparagraph:
    indentAfterThisHeading: 0
    level: 7
  subsection:
    indentAfterThisHeading: 0
    level: 4
  "subsection*":
    indentAfterThisHeading: 0
    level: 4
  subsubsection:
    indentAfterThisHeading: 0
    level: 5
indentAfterItems:
  description: 1
  "description*": 1
  enumerate: 1
  "enumerate*": 1
  itemize: 1
  "itemize*": 1
  list: 1
specialBeginEnd:
  displayMath:
    begin: "(?<!\\\\)\\\\\\["
    end: "\\\\\\]"
    lookForThis: 1
  displayMathTeX:
    # begin : "\\\$\\\$"
    # end : "\\\$\\\$"
    lookForThis: 1
  inlineMath:
    # begin : "(?<!\\\$)(?<!\\\\)\\\$(?!\\\$)"
    # body : "[^\$]*?"
    # end : "(?<!\\\\)\\\$(?!\\\$)"
    lookForThis: 1
  specialBeforeCommand: 0
verbatimCommands:
  lstinline: 1
  verb: 1
verbatimEnvironments:
  lstlisting: 1
  minted: 1
  verbatim: 1
oneSentencePerLine:
  manipulateSentences: 0
  multipleSpacesToSingle: 1
  removeSentenceLineBreaks: 1
  sentenceIndent: ""
  sentencesBeginWith:
    "A-Z": 1
    "a-z": 0
    other: 0
  sentencesDoNOTcontain:
    other: "\\\\begin"
  sentencesEndWith:
    basicFullStop: 0
    betterFullStop: 1
    exclamationMark: 1
    other: 0
    questionMark: 1
  sentencesFollow:
    blankLine: 1
    commentOnPreviousLine: 1
    exclamationMark: 1
    fullStop: 1
    other: 0
    par: 1
    questionMark: 1
    rightBrace: 1
  textWrapSentences: 0

modifyLineBreaks:
  preserveBlankLines: 1
  condenseMultipleBlankLinesInto: 1
